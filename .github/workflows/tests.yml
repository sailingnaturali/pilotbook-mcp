name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # fastembed reads this verbatim (no ~ expansion) to locate its model
      # cache; pinning it to an absolute path lets actions/cache persist the
      # BAAI/bge-small-en-v1.5 download across runs and keeps the [search]
      # tests off the network. github.workspace is absolute.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed-cache
          key: fastembed-bge-small-en-v1.5-${{ matrix.python-version }}
      - name: Pre-download embedding model (retry on HuggingFace hiccups)
        run: |
          for i in 1 2 3; do
            uv run python scripts/warm_model.py && exit 0
            echo "model fetch attempt $i failed; retrying..." >&2
            sleep $((i * 10))
          done
          echo "::warning::embedding model could not be fetched; [search] index tests will skip this run"
      - run: uv run pytest -v
