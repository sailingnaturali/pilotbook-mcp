[project]
name = "pilotbook-mcp"
version = "0.1.2"
description = "MCP server turning pilot-book PDFs into a queryable anchorage vault with comfort-ranked overnight recommendations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Bryan Clark", email = "clarkbw@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
ingest = [
    "anthropic>=0.40.0",
]

[project.scripts]
pilotbook-mcp = "pilotbook_mcp.server:main"
pilotbook = "pilotbook_mcp.ingest.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
